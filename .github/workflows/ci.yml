name: Design System CI

on:
  push:
    branches: [main, trunk]
  pull_request:
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Accept the current look of every story as the new visual baseline
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install browsers on; visual baselines are made on 24.04
    timeout-minutes: 45 # a normal run takes about 15; stop a stuck run instead of letting it hang
    permissions:
      contents: write # only used to commit new visual baselines when that box is ticked
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build tokens (all themes)
        run: npm run build
      - name: WCAG AA contrast gate
        run: npm run check:contrast
      - name: Design-source gate (every story names its Figma source)
        run: npm run check:sources
      - name: Rails parity gate (every Rails component renders the same HTML as Storybook)
        run: npm run check:rails
      - name: Build Storybook
        run: npm run build-storybook
      - name: Figma link gate (every Figma documentation link resolves)
        run: npm run check:links
      - name: Install Chromium for story tests
        run: npx playwright install --with-deps chromium
      - name: Story gate (every Vitae 27 story renders, play functions pass, axe WCAG 2.1 A/AA in all clients and modes)
        run: npm run check:stories
      - name: Visual regression (every story compared with visual-baselines/)
        id: visual
        if: ${{ !inputs.update_visual_baselines }}
        run: npm run check:visual
      - name: Upload visual report (baseline, new screenshot and diff for each change)
        if: ${{ always() && steps.visual.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: visual-report
      - name: Accept the current look as the new visual baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual_baselines }}
        run: |
          npm run check:visual -- --update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A visual-baselines
          if git diff --cached --quiet; then echo "Baselines already match."; else git commit -m "Update visual baselines [skip ci]" && git push; fi
      - name: Upload Storybook artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  rails-demo:
    # Installs the real Rails, ViewComponent and Lookbook gems and renders every component preview.
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install browsers on; visual baselines are made on 24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rails/demo
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: rails/demo
      - name: Render every Rails component preview in every client and mode
        run: bin/check-previews

  deploy-pages:
    timeout-minutes: 10
    # Publishes the design library to GitHub Pages on pushes to main, or when run by hand (Actions → Design System CI → Run workflow)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-and-check
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moved to 26.04, which Playwright 1.56 cannot install browsers on; visual baselines are made on 24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
